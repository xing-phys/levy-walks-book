project:
  type: book
  output-dir: _site
  resources:
    - .nojekyll
    - data/
  render:
    - '*.qmd'

book:
  title: 'Lévy Walks'
  subtitle: 'A self-contained course on finite-speed anomalous transport'
  output-file: levy-walks-book
  author:
    - name: Ze-Yu Xing
      orcid: 0009-0009-5655-0187
      affiliations:
        - Institute of Physics, Chinese Academy of Sciences
        - University of Chinese Academy of Sciences
  date: '2026-10-20'
  date-format: long
  site-url: https://xing-phys.github.io/levy-walks-book/
  repo-url: https://github.com/xing-phys/levy-walks-book
  repo-actions: [source, issue]
  search: true
  downloads: [pdf]
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - part: 'From random walks to Lévy walks'
      chapters:
        - 01-foundations.qmd
        - 02-renewal.qmd
        - 03-scaling.qmd
    - part: 'Beyond the basic model'
      chapters:
        - 04-extensions.qmd
        - 05-correlations.qmd
        - 06-kinetic.qmd
    - part: 'Mechanisms, experiments, and computation'
      chapters:
        - 07-physics.qmd
        - 08-biology.qmd
        - 09-search.qmd
        - 10-computation.qmd
    - references.qmd
  appendices:
    - a-toolbox.qmd
    - b-coverage.qmd
  page-footer:
    center: 'An independent learning companion to Zaburdaev, Denisov, and Klafter (2015). Original text and figures: CC BY 4.0.'

bibliography:
  - assets/refs-core.bib
  - assets/refs-theory.bib
  - assets/refs-applications.bib
csl: assets/american-physics-society.csl
link-citations: true
lang: en
execute:
  enabled: false
format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    fig-responsive: true
    include-in-header: assets/mathjax-config.html
    code-copy: true
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    papersize: a4
    geometry: [margin=25mm]
    fontsize: 11pt
    colorlinks: true
    toc: true
    toc-depth: 2
    number-sections: true
    include-in-header: assets/macros.sty
    keep-tex: false
    link-citations: true
    link-bibliography: true
    fig-pos: H
